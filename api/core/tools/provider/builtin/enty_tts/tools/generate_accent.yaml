identity:
  name: generate_accent
  author: Enty
  label:
    en_US: Generate Accent
    zh_Hans: Enty TTS - 创建音色
    pt_BR: Generate TTS Task
description:
  human:
    en_US: A tool for generating accent with audio files.
    zh_Hans: 一个用于通过音频文件在 Enty TTS 服务中创建音色的工具
    pt_BR: A tool for generating accent with audio files.
  llm: A tool for generating accent with audio files.
parameters:
  - name: accent_name
    type: string
    required: true
    label:
      en_US: Accent Name
      zh_Hans: 音色名
      pt_BR: Accent Name
    human_description:
      en_US: accent name to store, example - "vc_name_lily"
      zh_Hans: 要储存的音色名, 示例 - "vc_name_lily"
      pt_BR: accent name to store, example - "vc_name_lily"
    llm_description: accent name to store, example - "vc_name_lily"
    form: llm
  - name: audio_files
    type: files
    required: true
    label:
      en_US: Audio
      zh_Hans: 音频
      pt_BR: Audio
    human_description:
      en_US: Audio used to generate accent
      zh_Hans: 用于生成音色的音频文件
      pt_BR: Audio used to generate accent
    llm_description: Audio used to generate accent
    form: llm
  - name: timeout
    type: select
    required: true
    human_description:
      en_US: Set request timeout(s)
      zh_Hans: 设置请求超时时间(秒)
      pt_BR: Set request timeout(s)
    label:
      en_US: Timeout
      zh_Hans: 请求超时时间
      pt_BR: Timeout
    form: form
    options:
      - value: 30
        label:
          en_US: "30"
          zh_Hans: "30"
          pt_BR: "30"
      - value: 60
        label:
          en_US: "60"
          zh_Hans: "60"
          pt_BR: "60"
      - value: 90
        label:
          en_US: "90"
          zh_Hans: "90"
          pt_BR: "90"
      - value: 120
        label:
          en_US: "120"
          zh_Hans: "120"
          pt_BR: "120"
      - value: 150
        label:
          en_US: "150"
          zh_Hans: "150"
          pt_BR: "150"
      - value: 180
        label:
          en_US: "180"
          zh_Hans: "180"
          pt_BR: "180"
    default: 30