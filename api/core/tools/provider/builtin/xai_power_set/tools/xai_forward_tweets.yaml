identity:
  name: xai_forward_tweets
  author: Enty
  label:
    en_US: XAI Forward Tweets
    zh_Hans: XAI 转发推文
    pt_BR: XAI Forward Tweets
description:
  human:
    en_US: A tool for forward tweets with provided parameters.
    zh_Hans: 一个用于基于给定参数转发指定推文的工具。
    pt_BR: A tool for forward tweets with provided parameters.
  llm: A tool for forward tweets with provided parameters.
parameters:
  - name: tweets_user_name_one
    type: string
    required: true
    label:
      en_US: X Account
      zh_Hans: X 账号
      pt_BR: X Account
    human_description:
      en_US: X Account to forward the tweets
      zh_Hans: 需要转发指定推文的账号
      pt_BR: X Account to forward the tweets
    llm_description: X Account to forward the tweets
    form: llm
  - name: twitter_url
    type: string
    required: true
    label:
      en_US: Tweets Link
      zh_Hans: 推文链接
      pt_BR: Tweets Link
    human_description:
      en_US: Link of tweets to forward
      zh_Hans: 待转发推文的链接
      pt_BR: Link of tweets to forward
    llm_description: Link of tweets to forward
    form: llm
  - name: sync
    type: boolean
    required: true
    label:
      en_US: Sync
      zh_Hans: 堵塞同步
      pt_BR: Sync
    human_description:
      en_US: Whether to sync of not
      zh_Hans: 是否需要阻塞同步
      pt_BR: Whether to sync of not
    default: true
    form: form
    
