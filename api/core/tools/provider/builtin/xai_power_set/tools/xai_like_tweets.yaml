identity:
  name: xai_like_tweets
  author: Enty
  label:
    en_US: XAI LIKE TWEETS
    zh_Hans: XAI 点赞推文
    pt_BR: XAI LIKE TWEETS
description:
  human:
    en_US: A tool for like tweets with provided parameters.
    zh_Hans: 一个用于基于给定参数点赞指定推文的工具。
    pt_BR: A tool for like tweets with provided parameters.
  llm: A tool for like tweets with provided parameters.
parameters:
  - name: tweets_user_name
    type: string
    required: true
    label:
      en_US: X Account
      zh_Hans: X 账号
      pt_BR: X Account
    human_description:
      en_US: X Account to like the tweets
      zh_Hans: 需要对指定推文点赞的账号
      pt_BR: X Account to like the tweets
    llm_description: X Account to like the tweets
    form: llm
  - name: twitter_url
    type: string
    required: true
    label:
      en_US: Tweets Link
      zh_Hans: 推文链接
      pt_BR: Tweets Link
    human_description:
      en_US: Link of tweets to like
      zh_Hans: 待点赞推文的链接
      pt_BR: Link of tweets to like
    llm_description: Link of tweets to like
    form: llm
  - name: sync
    type: boolean
    required: true
    label:
      en_US: Sync
      zh_Hans: 堵塞同步
      pt_BR: Sync
    human_description:
      en_US: Whether to sync of not
      zh_Hans: 是否需要阻塞同步
      pt_BR: Whether to sync of not
    llm_description: Whether to sync of not
    form: llm
    
